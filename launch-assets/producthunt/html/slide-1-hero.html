<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --orange:#ff5c1a; --ink:#1a1a1a; --cream:#fffdf9; --muted:#6b6b6b;
    --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono','SF Mono',Menlo,monospace;
  }
  html,body{ width:1270px; height:760px; }
  .slide{
    position:relative; width:1270px; height:760px; overflow:hidden;
    background:var(--cream); font-family:var(--sans); color:var(--ink);
    display:flex; flex-direction:column; justify-content:center;
    padding:0 96px;
  }
  /* faint pixel-grid background */
  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(26,26,26,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,26,26,.035) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(circle at 70% 35%, #000 0%, transparent 75%);
  }
  .corner-square{
    position:absolute; background:var(--orange); border:5px solid var(--ink);
  }
  .brandrow{ display:flex; align-items:center; gap:18px; margin-bottom:34px; z-index:2; }
  .mark{ width:46px; height:46px; background:var(--orange); border:5px solid var(--ink); }
  .brandname{ font-weight:800; font-size:30px; letter-spacing:-.5px; }
  .brandname b{ color:var(--orange); }
  h1{
    font-weight:900; font-size:104px; line-height:.98; letter-spacing:-3.5px;
    z-index:2; max-width:1000px;
  }
  h1 .out{ color:var(--orange); }
  .underline{
    display:inline-block; height:14px; width:330px; background:var(--orange);
    border-radius:2px; margin-top:14px; margin-left:4px; z-index:2;
  }
  .subline{
    font-size:34px; font-weight:600; color:var(--muted); margin-top:34px;
    letter-spacing:-.5px; z-index:2;
  }
  .subline .free{ color:var(--ink); font-weight:800; }
  .cmd{
    margin-top:46px; z-index:2; display:inline-flex; align-items:center;
    gap:16px; background:var(--ink); color:var(--cream);
    font-family:var(--mono); font-size:30px; font-weight:600;
    padding:22px 34px; border-radius:14px; width:fit-content;
    box-shadow:10px 12px 0 rgba(255,92,26,.28);
  }
  .cmd .dollar{ color:var(--orange); font-weight:700; }
  .cmd .cursor{ width:14px; height:30px; background:var(--orange); display:inline-block; margin-left:2px; }
  .badges{ display:flex; gap:14px; margin-top:42px; z-index:2; }
  .badge{
    font-size:20px; font-weight:700; padding:12px 22px; border-radius:999px;
    border:3px solid var(--ink); background:#fff;
  }
  .badge.solid{ background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .pixels{ position:absolute; right:96px; top:140px; display:grid; grid-template-columns:repeat(4,42px); gap:10px; z-index:1; opacity:.9; }
  .px{ width:42px; height:42px; border:4px solid var(--ink); background:transparent; }
  .px.f{ background:var(--orange); }
</style>
</head>
<body>
  <div class="slide">
    <div class="grid-bg"></div>
    <div class="corner-square" style="width:160px;height:160px;left:-70px;bottom:-70px;opacity:.12;"></div>
    <div class="corner-square" style="width:90px;height:90px;right:300px;bottom:80px;opacity:.10;"></div>

    <div class="pixels">
      <div class="px f"></div><div class="px"></div><div class="px"></div><div class="px f"></div>
      <div class="px"></div><div class="px f"></div><div class="px f"></div><div class="px"></div>
      <div class="px"></div><div class="px f"></div><div class="px"></div><div class="px"></div>
      <div class="px f"></div><div class="px"></div><div class="px"></div><div class="px f"></div>
    </div>

    <div class="brandrow">
      <div class="mark"></div>
      <div class="brandname">Browser<b>Bash</b></div>
    </div>

    <h1>Plain English in.<br>Real browser <span class="out">out.</span></h1>
    <div class="underline"></div>

    <div class="subline"><span class="free">Free, open-source</span> AI browser automation</div>

    <div class="cmd">
      <span class="dollar">$</span> npm install -g browserbash-cli<span class="cursor"></span>
    </div>

    <div class="badges">
      <div class="badge solid">MIT licensed</div>
      <div class="badge">No selectors</div>
      <div class="badge">Ollama-first</div>
      <div class="badge">CI-ready</div>
    </div>
  </div>
</body>
</html>
